name: OrgChain Status

on:
  push:
    branches: [main]
    paths:
      - .upptimerc.yml
      - .github/workflows/status.yml
      - assets/**
  schedule:
    - cron: '2-57/5 * * * *'
    - cron: '17 1 * * *'
  workflow_dispatch:

permissions: {}
concurrency:
  group: orgchain-status
  cancel-in-progress: false

jobs:
  monitor:
    name: Check public availability
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0
      - name: Check endpoints and update incidents
        uses: upptime/uptime-monitor@a284d6064bcbf89db3f1e2a6c533d0e69111573b # v1.46.0
        with:
          command: update
        env:
          GH_PAT: ${{ github.token }}
          SECRETS_CONTEXT: '{}'
      - name: Record response times
        if: github.event_name != 'schedule' || github.event.schedule == '17 1 * * *'
        uses: upptime/uptime-monitor@a284d6064bcbf89db3f1e2a6c533d0e69111573b
        with:
          command: response-time
        env:
          GH_PAT: ${{ github.token }}
          SECRETS_CONTEXT: '{}'
      - name: Refresh public summary
        uses: upptime/uptime-monitor@a284d6064bcbf89db3f1e2a6c533d0e69111573b
        with:
          command: summary
        env:
          GH_PAT: ${{ github.token }}
          SECRETS_CONTEXT: '{}'
      - name: Set up graph runtime
        if: github.event_name != 'schedule' || github.event.schedule == '17 1 * * *'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Refresh response-time graphs
        if: github.event_name != 'schedule' || github.event.schedule == '17 1 * * *'
        run: |
          npx --yes @upptime/graphs@1.2.31
          git add -- api graphs
          if ! git diff --cached --quiet; then
            git -c user.name="Upptime Bot" -c user.email="73812536+upptime-bot@users.noreply.github.com" commit -m "Update response-time graphs"
            git push
          fi
        env:
          GH_PAT: ${{ github.token }}
          SECRETS_CONTEXT: '{}'

  build:
    name: Build independent status website
    needs: monitor
    if: github.event_name != 'schedule' || github.event.schedule == '17 1 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Generate Upptime website
        uses: upptime/uptime-monitor@a284d6064bcbf89db3f1e2a6c533d0e69111573b # v1.46.0
        with:
          command: site
        env:
          GH_PAT: ${{ github.token }}
          SECRETS_CONTEXT: '{}'
      - name: Upload public website
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site/status-page/__sapper__/export

  deploy:
    name: Publish to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy status website
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
